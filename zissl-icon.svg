<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- zissl — the sweet grain. Same cut as zaltz's salt crystal, but this one
       is rock candy: one violet only, lit from the top left, a small lump
       dissolving over the shoulder, one sparkle where the light lands. -->
  <defs>
    <linearGradient id="st" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3d1ff"/>
      <stop offset="1" stop-color="#7c63ff"/>
    </linearGradient>
    <linearGradient id="sl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b3fe6"/>
      <stop offset="1" stop-color="#3c22b3"/>
    </linearGradient>
    <linearGradient id="sr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3620a6"/>
      <stop offset="1" stop-color="#231270"/>
    </linearGradient>
  </defs>
  <!-- the lump over the shoulder -->
  <g>
    <polygon points="53,6 59.5,9.75 53,13.5 46.5,9.75" fill="url(#st)"/>
    <polygon points="46.5,9.75 53,13.5 53,21 46.5,17.25" fill="url(#sl)"/>
    <polygon points="59.5,9.75 53,13.5 53,21 59.5,17.25" fill="url(#sr)"/>
    <polyline points="46.5,9.75 53,6 59.5,9.75" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- the crystal -->
  <g>
    <polygon points="30,13 49.5,24.25 30,35.5 10.5,24.25" fill="url(#st)"/>
    <polygon points="10.5,24.25 30,35.5 30,58 10.5,46.75" fill="url(#sl)"/>
    <polygon points="49.5,24.25 30,35.5 30,58 49.5,46.75" fill="url(#sr)"/>
    <polyline points="10.5,24.25 30,13 49.5,24.25" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="30" y1="35.5" x2="30" y2="58" stroke="#fff" stroke-opacity=".14" stroke-width="1"/>
    <line x1="10.5" y1="24.25" x2="10.5" y2="46.75" stroke="#fff" stroke-opacity=".18" stroke-width=".9"/>
  </g>
  <!-- the sparkle — where the light lands on the crystal's lit corner -->
  <path d="M22 15.5 Q23.1 19.4 27 20.5 Q23.1 21.6 22 25.5 Q20.9 21.6 17 20.5 Q20.9 19.4 22 15.5 Z" fill="#fff" fill-opacity=".92"/>
  <path d="M40 28 Q40.55 29.95 42.5 30.5 Q40.55 31.05 40 33 Q39.45 31.05 37.5 30.5 Q39.45 29.95 40 28 Z" fill="#fff" fill-opacity=".55"/>
</svg>
