<html lang="en">
<head>
<meta charset="utf-8" />
<title>zissl golden gate — pixel-diff vs hydra-synth</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #0a0a0f; color: #e8e6f2; font: 13px/1.5 ui-monospace, Menlo, monospace; padding: 24px; }
  h1 { font-size: 15px; color: #b9aaff; margin-bottom: 4px; }
  p { color: #6f6a85; margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; max-width: 860px; }
  td, th { padding: 3px 10px; text-align: left; border-bottom: 1px solid #1c1c28; }
  th { color: #6f6a85; font-weight: normal; }
  .pass { color: #7ee2a8; }
  .fail { color: #ff8da3; }
  .num { font-variant-numeric: tabular-nums; }
  #summary { margin: 14px 0; font-size: 14px; }
  .stage { display: flex; gap: 12px; margin-bottom: 16px; align-items: flex-start; }
  .stage figure { margin: 0; }
  .stage figcaption { color: #6f6a85; font-size: 11px; margin-top: 3px; }
  canvas { image-rendering: pixelated; border: 1px solid #1c1c28; }
</style>
</head>
<body>
<h1>zissl golden gate</h1>
<p>Every sketch rendered by hydra-synth (WebGL) and zissl (WebGPU) on the same pinned clock, pixel-diffed. The zaltz treatment, applied to the picture.</p>
<div class="stage">
  <figure><canvas id="hc" width="256" height="144" style="width:256px"></canvas><figcaption>hydra-synth (reference)</figcaption></figure>
  <figure><canvas id="zc" width="256" height="144" style="width:256px"></canvas><figcaption>zissl (candidate)</figcaption></figure>
  <figure><canvas id="dc" width="256" height="144" style="width:256px"></canvas><figcaption>diff ×8</figcaption></figure>
</div>
<div id="summary">booting…</div>
<table id="results"><tr><th>sketch</th><th>MAE</th><th>corr</th><th>&gt;8/255 px</th><th></th></tr></table>

<script src="../node_modules/hydra-synth/dist/hydra-synth.js"></script>
<script type="module">
import Zissl from "../index.js";
import { SKETCHES } from "./sketches.js";
import { hydraRoster, zisslRoster, corpusCoverage, coverageVerdict } from "./coverage.js";

const W = 256, H = 144;
const DT = 16.666666;       // ms per warmup tick, both engines
const WARM = 24;            // frames — lets feedback loops settle identically
const T0 = 3.7;             // seconds on the shared clock at first tick
// Verdict thresholds: 8-bit output, two GPUs, two float pipelines — indistinguishable
// in practice means MAE under ~2.5/255 with correlation ≥ 0.995.
const MAE_PASS = 2.5, CORR_PASS = 0.995, HOT_PASS = 0.02;

const hCanvas = document.getElementById("hc");
const zCanvas = document.getElementById("zc");
const dCanvas = document.getElementById("dc");
const results = document.getElementById("results");
const summary = document.getElementById("summary");

// THE SELF-TEST (?mutate=<sketch>): a gate that cannot fail proves nothing. Ask
// for it and the named sketch is rendered by zissl with one parameter nudged —
// the runner then asserts that this sketch, and only this sketch, FAILS.
const MUTATE = new URLSearchParams(location.search).get("mutate");

// The external source both engines are fed: one canvas, painted by hand, at
// exactly the render size so no sampler filtering can enter the comparison.
function makeSourceCanvas() {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  for (let y = 0; y < H; y += 16) {
    for (let x = 0; x < W; x += 16) {
      const on = ((x / 16) + (y / 16)) % 2 === 0;
      g.fillStyle = on ? `rgb(${(x / W) * 255 | 0},${(y / H) * 255 | 0},200)` : "#101020";
      g.fillRect(x, y, 16, 16);
    }
  }
  return c;
}
const SOURCE_CANVAS = makeSourceCanvas();

// --- hydra (reference) -------------------------------------------------
const hydra = new Hydra({
  canvas: hCanvas, width: W, height: H,
  makeGlobal: false, detectAudio: false, autoLoop: false, precision: "highp",
});
const hs = hydra.synth;
const gl = hCanvas.getContext("webgl2") ?? hCanvas.getContext("webgl");

hs.bpm = 30; // pinned: array sequencing reads time · speed · (bpm/60)
hs.s0.init({ src: SOURCE_CANVAS, dynamic: false });

function renderHydra(sketch, warm = WARM) {
  hs.hush();
  hs.speed = 1;
  hs.bpm = 30;
  hs.s0.init({ src: SOURCE_CANVAS, dynamic: false }); // hydra's hush() clears sources
  // hush() swaps programs but leaves the last picture in the ping-pong fbos —
  // flush BOTH buffers to black so every sketch starts from the same silence.
  for (let i = 0; i < 2; i++) hydra.tick(DT);
  sketch(hs);
  hs.render(hs.o0);
  hs.time = T0;
  for (let i = 0; i < warm; i++) hydra.tick(DT);
  const buf = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  // GL reads bottom-up; flip to top-down so both sides share an orientation
  const flip = new Uint8ClampedArray(W * H * 4);
  for (let y = 0; y < H; y++) flip.set(buf.subarray((H - 1 - y) * W * 4, (H - y) * W * 4), y * W * 4);
  return flip;
}

// --- zissl (candidate) -------------------------------------------------
const z = await Zissl.create({ canvas: zCanvas, width: W, height: H, autoLoop: false });
z.bpm = 30;
z.s0.init({ src: SOURCE_CANVAS, dynamic: false });

async function renderZissl(sketch, warm = WARM, mutate = false) {
  z.hush();
  z.speed = 1;
  z.bpm = 30;
  z.s0.init({ src: SOURCE_CANVAS, dynamic: false });
  for (let i = 0; i < 2; i++) z.tick(DT); // symmetric flush (zissl hush clears on next tick)
  sketch(z);
  // The self-test's nudge: one output, one extra transform, small enough that
  // only a gate with real sensitivity notices it.
  if (mutate) z.src(z.o0).brightness(0.06).out(z.o0);
  z.render(z.o0);
  await z.ready(); // .out() compiles async — tick only when the program is live
  z.time = T0;
  for (let i = 0; i < warm; i++) z.tick(DT);
  const img = await z.readPixels(z.o0);
  return img.data;
}

// --- diff --------------------------------------------------------------
function compare(a, b) {
  let sumAbs = 0, hot = 0, n = 0;
  let sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
  for (let i = 0; i < a.length; i += 4) {
    for (let c = 0; c < 3; c++) {
      const d = Math.abs(a[i + c] - b[i + c]);
      sumAbs += d;
      if (d > 8) hot++;
      n++;
    }
    const la = 0.299 * a[i] + 0.587 * a[i + 1] + 0.114 * a[i + 2];
    const lb = 0.299 * b[i] + 0.587 * b[i + 1] + 0.114 * b[i + 2];
    sa += la; sb += lb; saa += la * la; sbb += lb * lb; sab += la * lb;
  }
  const px = a.length / 4;
  const cov = sab / px - (sa / px) * (sb / px);
  const va = saa / px - (sa / px) ** 2;
  const vb = sbb / px - (sb / px) ** 2;
  const corr = va > 1e-6 && vb > 1e-6 ? cov / Math.sqrt(va * vb) : va < 1e-6 && vb < 1e-6 ? 1 : 0;
  return { mae: sumAbs / n, corr, hotFrac: hot / n };
}

function showDiff(a, b) {
  const d = dCanvas.getContext("2d");
  const img = d.createImageData(W, H);
  for (let i = 0; i < a.length; i += 4) {
    for (let c = 0; c < 3; c++) img.data[i + c] = Math.min(255, Math.abs(a[i + c] - b[i + c]) * 8);
    img.data[i + 3] = 255;
  }
  d.putImageData(img, 0, 0);
}

// --- the coverage contract ---------------------------------------------
// Derived, never declared: hydra's own source file, the live engine's surface,
// and what the corpus actually calls.
let coverage = { pass: false, missing: [], untested: [], extras: [], total: 0, err: null };
try {
  const src = await fetch("../node_modules/hydra-synth/src/glsl/glsl-functions.js").then((r) => r.text());
  const roster = hydraRoster(src);
  if (roster.size < 40) throw new Error(`roster looks wrong (${roster.size} functions) — did hydra-synth move?`);
  coverage = coverageVerdict({
    roster,
    speaks: zisslRoster(z),
    covered: corpusCoverage(SKETCHES),
  });
} catch (e) {
  coverage.err = String(e).slice(0, 160);
}

// --- run ---------------------------------------------------------------
const mean = (a) => {
  let s = 0;
  for (let i = 0; i < a.length; i += 4) s += (a[i] + a[i + 1] + a[i + 2]) / 3;
  return s / (a.length / 4);
};

const rows = [];
for (const [name, sketch, opts] of SKETCHES) {
  let verdict;
  try {
    const ha = renderHydra(sketch, opts?.warm);
    const za = await renderZissl(sketch, opts?.warm, MUTATE === name);
    showDiff(ha, za);
    const m = compare(ha, za);
    if (opts?.beyond) {
      // BEYOND HYDRA: hydra can't render this at all (its shader doesn't
      // compile — the canvas stays black). The claim under test is that ours
      // paints, and that where a twin spelling exists the two agree exactly.
      const hydraBlack = mean(ha) < 0.5;
      const zisslPaints = mean(za) > 0.5;
      let twinMae = null;
      if (opts.twin) twinMae = compare(za, await renderZissl(opts.twin, opts.warm)).mae;
      verdict = {
        name, ...m, kind: "beyond", note: opts.beyond,
        hydraBlack, zisslPaints, twinMae,
        pass: hydraBlack && zisslPaints && (twinMae === null || twinMae <= MAE_PASS),
      };
    } else if (opts?.divergence) {
      // A NAMED, DELIBERATE DIFFERENCE: ours must paint, and must equal the
      // twin that spells our semantics out loud.
      const twinMae = opts.twin ? compare(za, await renderZissl(opts.twin, opts.warm)).mae : null;
      verdict = {
        name, ...m, kind: "divergence", note: opts.divergence, twinMae,
        pass: mean(za) > 0.5 && (twinMae === null || twinMae <= MAE_PASS),
      };
    } else {
      verdict = { name, ...m, kind: "match", pass: m.mae <= MAE_PASS && m.corr >= CORR_PASS && m.hotFrac <= HOT_PASS };
    }
  } catch (e) {
    verdict = { name, mae: NaN, corr: NaN, hotFrac: NaN, kind: "match", pass: false, err: String(e).slice(0, 120) };
  }
  rows.push(verdict);
  const tr = document.createElement("tr");
  const label =
    verdict.kind === "beyond" ? "beyond hydra" : verdict.kind === "divergence" ? "ours, by design" : "pass";
  tr.innerHTML = `<td>${verdict.name}</td>
    <td class="num">${verdict.mae.toFixed(2)}</td>
    <td class="num">${verdict.corr.toFixed(4)}</td>
    <td class="num">${(verdict.hotFrac * 100).toFixed(2)}%</td>
    <td class="${verdict.pass ? "pass" : "fail"}">${verdict.pass ? label : "FAIL"}${verdict.err ? " — " + verdict.err : ""}</td>`;
  results.appendChild(tr);
  summary.textContent = `${rows.filter((r) => r.pass).length}/${rows.length} pass…`;
}
const passed = rows.filter((r) => r.pass).length;
const worst = rows.filter((r) => !isNaN(r.mae)).sort((x, y) => y.mae - x.mae)[0];
const covLine = coverage.err
  ? `<span class="fail">coverage contract errored — ${coverage.err}</span>`
  : coverage.pass
    ? `<span class="pass">coverage ${coverage.total}/${coverage.total} of hydra's roster, all exercised</span>`
    : `<span class="fail">coverage FAIL — missing: ${coverage.missing.join(", ") || "none"} · untested: ${coverage.untested.join(", ") || "none"}</span>`;
summary.innerHTML = `<b class="${passed === rows.length ? "pass" : "fail"}">${passed}/${rows.length} pass</b>` +
  (worst ? ` — worst MAE ${worst.mae.toFixed(2)} (${worst.name})` : "") +
  `<br>${covLine}`;
window.__gate = rows; // machine-readable for CI / the agent
window.__coverage = coverage;
window.__done = true;
window.__dbg = { hydra, hs, gl, z, renderHydra, renderZissl, compare, W, H };
</script>
</body>
</html>
